<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="272" viewBox="0 0 320 272" role="img" aria-labelledby="title description">
  <title id="title">All regular-route representation types for N=5</title>
  <desc id="description">N=5 is prime: (k=5, s=1). All diagrams have the same length scale. Blue diagrams have unit steps; amber diagrams have non-unit steps. A digon is drawn as one segment with two opposite arrows on that segment: the route traverses the same segment twice, so its total length is 2s.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1" y="1" width="318" height="213" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="19" y="31" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 5  |  Prime</text>
    <text x="19" y="56" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">1 representation type</text>
    <polygon points="160,75.5714 195.5967,101.4339 182,143.2804 138,143.2804 124.4033,101.4339" fill="#edf4fd" stroke="#235da8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="160" cy="75.5714" r="3.3" fill="#235da8"/>
    <circle cx="195.5967" cy="101.4339" r="3.3" fill="#235da8"/>
    <circle cx="182" cy="143.2804" r="3.3" fill="#235da8"/>
    <circle cx="138" cy="143.2804" r="3.3" fill="#235da8"/>
    <circle cx="124.4033" cy="101.4339" r="3.3" fill="#235da8"/>
    <text x="160" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (5, 1)</text>
    <text x="160" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <text x="160" y="239" font-size="17" font-weight="normal" text-anchor="middle" fill="#4e6072">All diagrams share one length scale.</text>
  </g>
</svg>
