<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title description">
  <title id="title">Regular routes for total lengths 2 to 6</title>
  <desc id="description">N=2 is prime: (k=2, s=1). N=3 is prime: (k=3, s=1). N=4 is composite: (k=2, s=2), (k=4, s=1). N=5 is prime: (k=5, s=1). N=6 is composite: (k=2, s=3), (k=3, s=2), (k=6, s=1). All diagrams have the same length scale. Blue diagrams have unit steps; amber diagrams have non-unit steps. A digon is drawn as one segment with two opposite arrows on that segment: the route traverses the same segment twice, so its total length is 2s.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="22" y="34" font-size="28" font-weight="bold" text-anchor="start" fill="#182d43">Regular routes for total lengths 2 to 6</text>
    <text x="22" y="64" font-size="20" font-weight="normal" text-anchor="start" fill="#4e6072">Primes have one representation type; composites have more.</text>
    <rect x="20" y="86" width="230" height="212" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="38" y="116" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 2  |  Prime</text>
    <text x="38" y="141" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">1 representation type</text>
    <line x1="113" y1="198" x2="157" y2="198" stroke="#235da8" stroke-width="3" stroke-linecap="round"/>
    <polyline points="133.08,194 127.08,198 133.08,202" fill="none" stroke="#235da8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="136.92,194 142.92,198 136.92,202" fill="none" stroke="#235da8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="113" cy="198" r="3.3" fill="#235da8"/>
    <circle cx="157" cy="198" r="3.3" fill="#235da8"/>
    <text x="135" y="263" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (2, 1)</text>
    <text x="135" y="286" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <rect x="265" y="86" width="230" height="212" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="283" y="116" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 3  |  Prime</text>
    <text x="283" y="141" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">1 representation type</text>
    <polygon points="380,172.5966 402,210.7017 358,210.7017" fill="#edf4fd" stroke="#235da8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="380" cy="172.5966" r="3.3" fill="#235da8"/>
    <circle cx="402" cy="210.7017" r="3.3" fill="#235da8"/>
    <circle cx="358" cy="210.7017" r="3.3" fill="#235da8"/>
    <text x="380" y="263" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (3, 1)</text>
    <text x="380" y="286" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <rect x="510" y="86" width="470" height="212" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="528" y="116" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 4  |  Composite</text>
    <text x="528" y="141" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">2 representation types</text>
    <line x1="583.5" y1="198" x2="671.5" y2="198" stroke="#966006" stroke-width="3" stroke-linecap="round"/>
    <polyline points="617.66,194 611.66,198 617.66,202" fill="none" stroke="#966006" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="637.34,194 643.34,198 637.34,202" fill="none" stroke="#966006" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="583.5" cy="198" r="3.3" fill="#966006"/>
    <circle cx="671.5" cy="198" r="3.3" fill="#966006"/>
    <text x="627.5" y="263" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (2, 2)</text>
    <text x="627.5" y="286" font-size="18" font-weight="normal" text-anchor="middle" fill="#966006">Non-unit steps</text>
    <polygon points="884.5,176 884.5,220 840.5,220 840.5,176" fill="#edf4fd" stroke="#235da8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="884.5" cy="176" r="3.3" fill="#235da8"/>
    <circle cx="884.5" cy="220" r="3.3" fill="#235da8"/>
    <circle cx="840.5" cy="220" r="3.3" fill="#235da8"/>
    <circle cx="840.5" cy="176" r="3.3" fill="#235da8"/>
    <text x="862.5" y="263" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (4, 1)</text>
    <text x="862.5" y="286" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <rect x="20" y="311" width="295" height="212" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="38" y="341" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 5  |  Prime</text>
    <text x="38" y="366" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">1 representation type</text>
    <polygon points="167.5,385.5714 203.0967,411.4339 189.5,453.2804 145.5,453.2804 131.9033,411.4339" fill="#edf4fd" stroke="#235da8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="167.5" cy="385.5714" r="3.3" fill="#235da8"/>
    <circle cx="203.0967" cy="411.4339" r="3.3" fill="#235da8"/>
    <circle cx="189.5" cy="453.2804" r="3.3" fill="#235da8"/>
    <circle cx="145.5" cy="453.2804" r="3.3" fill="#235da8"/>
    <circle cx="131.9033" cy="411.4339" r="3.3" fill="#235da8"/>
    <text x="167.5" y="488" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (5, 1)</text>
    <text x="167.5" y="511" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <rect x="330" y="311" width="650" height="212" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="348" y="341" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 6  |  Composite</text>
    <text x="348" y="366" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">3 representation types</text>
    <line x1="372.3333" y1="423" x2="504.3333" y2="423" stroke="#966006" stroke-width="3" stroke-linecap="round"/>
    <polyline points="420.5733,419 414.5733,423 420.5733,427" fill="none" stroke="#966006" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="456.0933,419 462.0933,423 456.0933,427" fill="none" stroke="#966006" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="372.3333" cy="423" r="3.3" fill="#966006"/>
    <circle cx="504.3333" cy="423" r="3.3" fill="#966006"/>
    <text x="438.3333" y="488" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (2, 3)</text>
    <text x="438.3333" y="511" font-size="18" font-weight="normal" text-anchor="middle" fill="#966006">Non-unit steps</text>
    <polygon points="655,372.1932 699,448.4034 611,448.4034" fill="#fff5e5" stroke="#966006" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="655" cy="372.1932" r="3.3" fill="#966006"/>
    <circle cx="699" cy="448.4034" r="3.3" fill="#966006"/>
    <circle cx="611" cy="448.4034" r="3.3" fill="#966006"/>
    <text x="655" y="488" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (3, 2)</text>
    <text x="655" y="511" font-size="18" font-weight="normal" text-anchor="middle" fill="#966006">Non-unit steps</text>
    <polygon points="871.6667,379 909.7718,401 909.7718,445 871.6667,467 833.5615,445 833.5615,401" fill="#edf4fd" stroke="#235da8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="871.6667" cy="379" r="3.3" fill="#235da8"/>
    <circle cx="909.7718" cy="401" r="3.3" fill="#235da8"/>
    <circle cx="909.7718" cy="445" r="3.3" fill="#235da8"/>
    <circle cx="871.6667" cy="467" r="3.3" fill="#235da8"/>
    <circle cx="833.5615" cy="445" r="3.3" fill="#235da8"/>
    <circle cx="833.5615" cy="401" r="3.3" fill="#235da8"/>
    <text x="871.6667" y="488" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (6, 1)</text>
    <text x="871.6667" y="511" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <text x="22" y="551" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">Each (k, s) records k steps of length s. All routes use the same length scale.</text>
    <text x="22" y="576" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">The digon traverses one segment twice; its arrows lie on the coincident edges.</text>
  </g>
</svg>
