<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="510" height="272" viewBox="0 0 510 272" role="img" aria-labelledby="title description">
  <title id="title">All regular-route representation types for N=4</title>
  <desc id="description">N=4 is composite: (k=2, s=2), (k=4, s=1). All diagrams have the same length scale. Blue diagrams have unit steps; amber diagrams have non-unit steps. A digon is drawn as one segment with two opposite arrows on that segment: the route traverses the same segment twice, so its total length is 2s.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1" y="1" width="508" height="213" rx="10" fill="#ffffff" stroke="#d5dfe8"/>
    <text x="19" y="31" font-size="23" font-weight="bold" text-anchor="start" fill="#182d43">N = 4  |  Composite</text>
    <text x="19" y="56" font-size="18" font-weight="normal" text-anchor="start" fill="#4e6072">2 representation types</text>
    <line x1="84" y1="113" x2="172" y2="113" stroke="#966006" stroke-width="3" stroke-linecap="round"/>
    <polyline points="118.16,109 112.16,113 118.16,117" fill="none" stroke="#966006" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="137.84,109 143.84,113 137.84,117" fill="none" stroke="#966006" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="84" cy="113" r="3.3" fill="#966006"/>
    <circle cx="172" cy="113" r="3.3" fill="#966006"/>
    <text x="128" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (2, 2)</text>
    <text x="128" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#966006">Non-unit steps</text>
    <polygon points="404,91 404,135 360,135 360,91" fill="#edf4fd" stroke="#235da8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="404" cy="91" r="3.3" fill="#235da8"/>
    <circle cx="404" cy="135" r="3.3" fill="#235da8"/>
    <circle cx="360" cy="135" r="3.3" fill="#235da8"/>
    <circle cx="360" cy="91" r="3.3" fill="#235da8"/>
    <text x="382" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#182d43">(k, s) = (4, 1)</text>
    <text x="382" y="201" font-size="18" font-weight="normal" text-anchor="middle" fill="#235da8">Unit steps</text>
    <text x="255" y="239" font-size="17" font-weight="normal" text-anchor="middle" fill="#4e6072">All diagrams share one length scale.</text>
    <text x="255" y="262" font-size="17" font-weight="normal" text-anchor="middle" fill="#4e6072">Digon: one segment, two traversals.</text>
  </g>
</svg>
